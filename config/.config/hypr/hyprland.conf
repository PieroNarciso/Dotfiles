# This is an example Hyprland config file.
#
# Refer to the wiki for more information.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-2,2560x1440@180,0x0,1
monitor=HDMI-A-0,1920x1080@120,1920x0,2


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = waybar
exec-once = hyprpaper
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dunst
exec-once = nm-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only text data

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = alacritty
$fileManager = nemo

# Some default env vars.
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that
env = BAT_THEME,gruvbox-dark
env = GTK_THEME,Arc:dark
env = TDESKTOP_USE_GTK_FILE_DIALOG,1

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,us
    kb_variant = ,altgr-intl
    kb_model =
    kb_options = grp:win_space_toggle,caps:escape
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }

    accel_profile = flat
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 4

    blur {
        enabled = true
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
}

animations {
    enabled = false

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = "slave"
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = false
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 to disable the anime mascot wallpapers
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = suppressevent maximize, class:.*


# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Q, killactive,
# bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, t, togglefloating,
bind = $mainMod CONTROL, Return, exec, wofi --show drun
bind = $mainMod, B, exec, chromium
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod SHIFT, s, exec, ~/.config/hypr/scripts/screenshot.sh
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Move focus with mainMod + vim keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# workspaces
workspace = 1, monitor:DP-3
workspace = 2, monitor:DP-3
workspace = 3, monitor:DP-3
workspace = 4, monitor:DP-3
workspace = 5, monitor:DP-3
workspace = 6, monitor:DP-3
workspace = 7, monitor:DP-3
workspace = 8, monitor:DP-3
workspace = 9, monitor:DP-3
workspace = 10, monitor:DP-3
workspace = 11, monitor:HDMI-A-0
workspace = 12, monitor:HDMI-A-0
workspace = 13, monitor:HDMI-A-0
workspace = 14, monitor:HDMI-A-0
workspace = 15, monitor:HDMI-A-0
workspace = 16, monitor:HDMI-A-0
workspace = 17, monitor:HDMI-A-0
workspace = 18, monitor:HDMI-A-0
workspace = 19, monitor:HDMI-A-0
workspace = 20, monitor:HDMI-A-0

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, ~/.cargo/bin/hyprsome workspace 1
bind = $mainMod, 2, exec, ~/.cargo/bin/hyprsome workspace 2
bind = $mainMod, 3, exec, ~/.cargo/bin/hyprsome workspace 3
bind = $mainMod, 4, exec, ~/.cargo/bin/hyprsome workspace 4
bind = $mainMod, 5, exec, ~/.cargo/bin/hyprsome workspace 5
bind = $mainMod, 6, exec, ~/.cargo/bin/hyprsome workspace 6
bind = $mainMod, 7, exec, ~/.cargo/bin/hyprsome workspace 7
bind = $mainMod, 8, exec, ~/.cargo/bin/hyprsome workspace 8
bind = $mainMod, 9, exec, ~/.cargo/bin/hyprsome workspace 9
bind = $mainMod, 0, exec, ~/.cargo/bin/hyprsome workspace 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod CONTROL, 1, exec, ~/.cargo/bin/hyprsome move 1
bind = $mainMod CONTROL, 2, exec, ~/.cargo/bin/hyprsome move 2
bind = $mainMod CONTROL, 3, exec, ~/.cargo/bin/hyprsome move 3
bind = $mainMod CONTROL, 4, exec, ~/.cargo/bin/hyprsome move 4
bind = $mainMod CONTROL, 5, exec, ~/.cargo/bin/hyprsome move 5 
bind = $mainMod CONTROL, 6, exec, ~/.cargo/bin/hyprsome move 6
bind = $mainMod CONTROL, 7, exec, ~/.cargo/bin/hyprsome move 7
bind = $mainMod CONTROL, 8, exec, ~/.cargo/bin/hyprsome move 8
bind = $mainMod CONTROL, 9, exec, ~/.cargo/bin/hyprsome move 9
bind = $mainMod CONTROL, 0, exec, ~/.cargo/bin/hyprsome move 10

# Windows binds
bind = $mainMod, F, fullscreen
bind = $mainMod, O, movewindow, mon:+1

# Monitor binds
bind = $mainMod CONTROL, l, focusmonitor, r
bind = $mainMod CONTROL, h, focusmonitor, l

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

