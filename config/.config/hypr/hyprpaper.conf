wallpaper {
    monitor = DP-3
    path = ~/.local/share/wallpapers/gruvbox-refraction.png
    fit_mode = cover
}

wallpaper {
    monitor = HDMI-A-1
    path = ~/.local/share/wallpapers/gruvbox-refraction.png
    fit_mode = cover
}

# Any other output -- a laptop's eDP-1, a projector. "*" is hyprpaper's
# wildcard; the named blocks above still win on the desktop.
wallpaper {
    monitor = *
    path = ~/.local/share/wallpapers/gruvbox-refraction.png
    fit_mode = cover
}

splash = false
ipc = true
