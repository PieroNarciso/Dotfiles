# hyprlock.conf — gruvbox theme (matches waybar / hyprland / rofi / dunst)
# rendered text supports pango markup. ref https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
# clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

$font = FiraCode Nerd Font

# gruvbox palette
$bg     = rgb(282828)
$bg1    = rgb(3c3836)
$fg     = rgb(ebdbb2)
$gray   = rgb(a89984)
$yellow = rgb(fabd2f)
$orange = rgb(fe8019)
$green  = rgb(b8bb26)
$aqua   = rgb(8ec07c)
$red    = rgb(fb4934)
$reddk  = rgb(cc241d)

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.local/share/wallpapers/gruvbox-refraction.png
    blur_passes = 2
    blur_size = 4
    color = $bg
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(28, 28, 28, 0.6) # gruvbox bg, semi-transparent

    outer_color = $yellow $orange 45deg   # idle: hypr border gradient
    check_color = $green $aqua 120deg     # verifying
    fail_color  = $red $reddk 40deg       # wrong password

    font_color = $fg
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = <span foreground="##a89984"><i>Input password...</i></span>
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = $yellow
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    color = $fg
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = $LAYOUT[en,ru]
    color = $gray
    font_size = 24
    font_family = $font
    onclick = hyprctl switchxkblayout all next

    position = 250, -20
    halign = center
    valign = center
}
